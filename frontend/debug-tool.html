<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Debug Tool - Chẩn đoán & Khắc phục lỗi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .search-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .search-form { display: flex; gap: 10px; }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .search-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .loading { 
            text-align: center; 
            padding: 40px; 
            color: white; 
            display: none;
            font-size: 1.2em;
        }
        
        .loading.active { display: block; }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results { display: none; }
        .results.active { display: block; }
        
        .summary-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .summary-item {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }
        
        .summary-number {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .summary-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
        }
        
        .critical-issues { border-color: #dc2626; }
        .critical-issues .summary-number { color: #dc2626; }
        
        .warnings { border-color: #f59e0b; }
        .warnings .summary-number { color: #f59e0b; }
        
        .passed-tests { border-color: #10b981; }
        .passed-tests .summary-number { color: #10b981; }
        
        .category-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .category-header {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .check-item {
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid;
        }
        
        .check-item.pass {
            background: #f0fdf4;
            border-left-color: #10b981;
        }
        
        .check-item.fail {
            background: #fef2f2;
            border-left-color: #dc2626;
        }
        
        .check-item.warning {
            background: #fffbeb;
            border-left-color: #f59e0b;
        }
        
        .check-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .check-title {
            font-weight: 600;
            font-size: 1.1em;
            color: #333;
        }
        
        .check-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-pass { background: #d1fae5; color: #10b981; }
        .badge-fail { background: #fee2e2; color: #dc2626; }
        .badge-warning { background: #fef3c7; color: #f59e0b; }
        
        .check-message {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .check-details {
            background: rgba(0,0,0,0.05);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9em;
            font-family: monospace;
            margin: 10px 0;
            word-break: break-all;
        }
        
        .solution-box {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
        }
        
        .solution-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.05em;
        }
        
        .solution-steps {
            padding-left: 20px;
            color: #444;
            line-height: 1.8;
        }
        
        .solution-steps li {
            margin-bottom: 8px;
        }
        
        .solution-code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9em;
            margin: 5px 0;
            overflow-x: auto;
        }
        
        .recommendations {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .recommendation-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid white;
        }
        
        .recommendation-title {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 8px;
        }
        
        .toggle-solution {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .toggle-solution:hover {
            background: #5568d3;
        }
        
        .hidden { display: none; }
        
        @media (max-width: 768px) {
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Website Debug Tool</h1>
            <p>Chẩn đoán lỗi chi tiết & Hướng dẫn khắc phục từng bước</p>
        </div>

        <div class="search-box">
            <form class="search-form" id="searchForm">
                <input type="text" class="search-input" id="domainInput" 
                       placeholder="Nhập domain cần debug (vd: example.com)" required>
                <button type="submit" class="search-btn">🔍 Debug Website</button>
            </form>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Đang chẩn đoán website... (có thể mất 10-30 giây)</p>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const input = document.getElementById('domainInput');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const domain = input.value.trim();
            if (!domain) return;

            loading.classList.add('active');
            results.classList.remove('active');
            results.innerHTML = '';

            try {
                const response = await fetch(`/api/debug?domain=${encodeURIComponent(domain)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Debug failed');
                }

                displayResults(data);
            } catch (error) {
                results.innerHTML = `
                    <div class="category-section">
                        <div style="color: #dc2626; text-align: center; padding: 40px;">
                            <h2>❌ Lỗi</h2>
                            <p>${error.message}</p>
                        </div>
                    </div>
                `;
                results.classList.add('active');
            } finally {
                loading.classList.remove('active');
            }
        });

        function displayResults(data) {
            let html = '';

            // Summary
            html += `
                <div class="summary-box">
                    <h2>📊 Tổng Quan Debug</h2>
                    <div class="summary-grid">
                        <div class="summary-item critical-issues">
                            <div class="summary-number">${data.summary.criticalIssues}</div>
                            <div class="summary-label">Lỗi Nghiêm Trọng</div>
                        </div>
                        <div class="summary-item warnings">
                            <div class="summary-number">${data.summary.warnings}</div>
                            <div class="summary-label">Cảnh Báo</div>
                        </div>
                        <div class="summary-item passed-tests">
                            <div class="summary-number">${data.summary.passed}</div>
                            <div class="summary-label">Tests Passed</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-number">${data.summary.totalIssues}</div>
                            <div class="summary-label">Tổng Vấn Đề</div>
                        </div>
                    </div>
                </div>
            `;

            // Recommendations
            if (data.recommendations && data.recommendations.length > 0) {
                html += '<div class="recommendations"><h2>💡 Khuyến Nghị</h2>';
                data.recommendations.forEach(rec => {
                    html += `
                        <div class="recommendation-item">
                            <div class="recommendation-title">${rec.title}</div>
                            <div>${rec.description}</div>
                            <div style="margin-top: 10px; font-style: italic;">
                                → ${rec.action}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Categories
            const categoryIcons = {
                dns: '🌐',
                connectivity: '🔌',
                ssl: '🔒',
                http: '📡',
                performance: '⚡',
                configuration: '⚙️'
            };

            const categoryNames = {
                dns: 'DNS Resolution',
                connectivity: 'Connectivity',
                ssl: 'SSL/TLS',
                http: 'HTTP Response',
                performance: 'Performance',
                configuration: 'Configuration'
            };

            for (const [category, checks] of Object.entries(data.categories)) {
                if (checks.length === 0) continue;

                html += `
                    <div class="category-section">
                        <div class="category-header">
                            <span>${categoryIcons[category] || '📋'}</span>
                            <span>${categoryNames[category] || category}</span>
                        </div>
                `;

                checks.forEach((check, index) => {
                    const badgeClass = `badge-${check.status}`;
                    const statusIcon = {
                        'pass': '✅',
                        'fail': '❌',
                        'warning': '⚠️'
                    }[check.status] || '●';

                    html += `
                        <div class="check-item ${check.status}">
                            <div class="check-header">
                                <div class="check-title">${statusIcon} ${check.test}</div>
                                <span class="check-badge ${badgeClass}">
                                    ${check.status.toUpperCase()}
                                </span>
                            </div>
                            <div class="check-message">${check.message}</div>
                            ${check.details ? `
                                <div class="check-details">
                                    ${typeof check.details === 'object' ? 
                                        JSON.stringify(check.details, null, 2) : 
                                        check.details}
                                </div>
                            ` : ''}
                            ${check.solution ? `
                                <button class="toggle-solution" onclick="toggleSolution('sol-${category}-${index}')">
                                    📖 Xem Hướng Dẫn Khắc Phục
                                </button>
                                <div id="sol-${category}-${index}" class="solution-box hidden">
                                    <div class="solution-title">✨ ${check.solution.title}</div>
                                    ${check.solution.steps ? `
                                        <ol class="solution-steps">
                                            ${check.solution.steps.map(step => `<li>${escapeHtml(step)}</li>`).join('')}
                                        </ol>
                                    ` : ''}
                                    ${check.solution.reference ? `
                                        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0;">
                                            📚 Tham khảo: <a href="${check.solution.reference}" target="_blank" style="color: #667eea;">${check.solution.reference}</a>
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                html += '</div>';
            }

            results.innerHTML = html;
            results.classList.add('active');
        }

        function toggleSolution(id) {
            const element = document.getElementById(id);
            element.classList.toggle('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
