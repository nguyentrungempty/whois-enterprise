<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Quét WHOIS & Phân Tích Website</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Công Cụ Quét WHOIS & Phân Tích Website</h1>
	    <p>Phân Tích Toàn Diện: WHOIS, DNS, Tech Stack, Debug & Sitemap, Quét Mã Độc</p>
        </div>

        <div class="search-box">
            <form class="search-form" id="searchForm">
                <input type="text" class="search-input" id="domainInput" placeholder="Nhập tên miền (vd: facebook.com)" required>
                <button type="submit" class="search-btn">🔍 Quét Toàn Bộ</button>
            </form>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Đang quét toàn bộ thông tin... (20-40 giây)</p>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="result-tabs">
                <div class="result-tab active" onclick="switchTab('scan')">
                    📊 WHOIS & Tech Stack
                </div>
                <div class="result-tab" onclick="switchTab('debug')">
                    🔧 Debug & Lỗi
                </div>
                <div class="result-tab" onclick="switchTab('sitemap')">
                    🗺️ Sitemap & URLs
                </div>
		<div class="result-tab" onclick="switchTab('malware')">
                    🛡️ Quét Mã Độc
                </div>
            </div>

            <div class="tab-content active" id="scanTab"></div>
            <div class="tab-content" id="debugTab"></div>
            <div class="tab-content" id="sitemapTab"></div>
	    <div class="tab-content" id="malwareTab"></div>
        </div>
    </div>
    <button id="backToTop">⬆ Top</button>

</body>

</html>
